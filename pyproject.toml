[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lp-lora-trainer"
version = "0.1.0"
description = "Independent desktop LoRA trainer and engine version manager"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "Pillow>=11,<13",
]

[project.optional-dependencies]
desktop = ["pywebview>=5,<7"]
test = [] # Tests use real local HTTP and the application runtime only.

[project.scripts]
lp-lora-trainer = "desktop.launcher:run"
lp-lora-api = "app.api.server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "desktop*", "supervisor*", "adapters*"]
exclude = ["engine*", "frontend*", "tests*"]
